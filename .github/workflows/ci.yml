name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compose refuses to start without secrets
        run: |
          if docker compose config >/dev/null 2>&1; then
            echo "::error::compose rendered without a .env: a required secret has a default again"; exit 1
          fi
      - name: Validate Compose model (with generated secrets)
        run: |
          cp .env.example .env
          sed -i -E 's/=(GENERATE_ME|CHANGE_ME)$/='"$(openssl rand -hex 16)"'/' .env
          docker compose config >/tmp/compose.yml
      - name: Python syntax
        run: python -m py_compile collector/collector.py
      - name: Collector tests
        run: |
          pip install -q -r collector/requirements.txt
          python -m unittest discover -s collector/tests -v
