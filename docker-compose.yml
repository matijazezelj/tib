services:

  tib-collector:
    build: ./collector
    container_name: tib-collector
    restart: unless-stopped
    volumes:
      - tib-data:/data
    environment:
      - VICTORIAMETRICS_URL=${VICTORIAMETRICS_URL:-http://tib-victoriametrics:8428}
      - VIB_VICTORIAMETRICS_URL=${VIB_VICTORIAMETRICS_URL:-}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
      - SYNC_ON_STARTUP=${SYNC_ON_STARTUP:-true}
    depends_on:
      - tib-victoriametrics
    networks:
      - tib

  tib-victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: tib-victoriametrics
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VICTORIAMETRICS_PORT:-8430}:8428"
    volumes:
      - tib-victoriametrics-data:/storage
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=${VICTORIAMETRICS_RETENTION:-90d}
      - --httpListenAddr=:8428
    networks:
      - tib

  tib-grafana:
    image: grafana/grafana:latest
    container_name: tib-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3002}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/tib-overview.json
    volumes:
      - tib-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - tib

networks:
  tib:
    name: tib

volumes:
  tib-data:
  tib-victoriametrics-data:
  tib-grafana-data:
